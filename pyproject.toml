[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "steambridge"
version = "0.2.0"
description = "Kernel-backed Steam Controller 2026 to Xbox gamepad bridge for Linux"
requires-python = ">=3.10"
dependencies = ["evdev>=1.6"]
license = {text = "MIT"}

[project.scripts]
steambridge = "steambridge.__main__:main"

[tool.setuptools]
packages = ["steambridge"]
